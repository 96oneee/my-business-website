<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>NO.KIT.LAB · Site admin</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Absolute path so the admin also loads at /admin without a trailing slash. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <script>
      // If the login session was lost (for example after a failed token refresh), the admin
      // would still think someone is logged in and fail with "Failed getting access token".
      // Forget the stale login so the admin shows the "Login" button instead.
      try {
        if (localStorage.getItem('decap-cms-user') && !localStorage.getItem('gotrue.user')) {
          localStorage.removeItem('decap-cms-user');
        }
      } catch (e) {}
    </script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
    <script>
      // Preview panes use the site's fonts and colours.
      CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Jost:wght@500&display=swap');
      CMS.registerPreviewStyle('/admin/preview.css');
    </script>
  </body>
</html>
