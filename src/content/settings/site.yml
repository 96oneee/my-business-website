hero_headline: Engineering Biology. Advancing Discovery.
hero_description: >-
  Our laboratory focuses on translational and functional genomics to understand how genetic
  alterations drive human disease. We combine CRISPR-based genome editing, in vivo cancer modeling,
  molecular biology, and genomic approaches to uncover the functional consequences of
  disease-associated genes and variants. Our research spans cancer biology and rare genetic
  disorders, with a particular interest in translating discoveries from genomic data into biological
  mechanisms and, ultimately, new opportunities for precision medicine.
