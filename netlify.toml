# The public site is hosted on Vercel (see vercel.json). Netlify only provides the
# admin login (Identity + Git Gateway), which Vercel reaches through /.netlify/*.
# Netlify builds are skipped so they don't use the free plan's deploy credits.
[build]
  command = "npm run build"
  publish = "dist"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
